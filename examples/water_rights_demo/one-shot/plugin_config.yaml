schema: ./water_rights_schema.json5

data_type_short_desc: water rights and regulations

doc_selection_method: "multi doc context"  # Important for water rights!

query_templates:
  - "{jurisdiction} rules"
  - "{jurisdiction} management plan"
  - "{jurisdiction} well permits"
  - "{jurisdiction} well permit requirements"
  - "requirements to drill a water well in {jurisdiction}"

website_keywords:
  - "pdf"
  - "water"
  - "rights"
  - "zoning"
  - "ordinance"
  - "renewable energy"
  - ["plan", "planning", "permit"]
  - "government"
  - ["code", "area"]
  - "land development"
  - ["land", "environment", "energy", 'renewable']
  - ["municipal", "department", "development"]

collection_prompts: True  # Can disable this to pass entire document to context

extraction_system_prompt: |-
  You are a legal scholar extracting structured data from water rights and groundwater conservation district regulations.
  Follow all instructions in the schema descriptions carefully.
