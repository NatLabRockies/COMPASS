
[workspace]
name = "INFRA-COMPASS"
channels = ["conda-forge", "microsoft"]
platforms = ["win-64", "osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[environments]
default = { features = ["python-default", "elm"], solve-group = "default" }
rdev = { features = ["rust-dev"], solve-group = "rust" }
pdev = { features = ["python-default", "elm", "python-dev", "python-build", "python-test", "python-doc", "python-anthropic"], solve-group = "python" }
ptest = { features = ["python-default", "elm", "python-test"], solve-group = "python" }
pdoc = { features = ["python-default", "elm", "python-doc"], solve-group = "python" }
pbuild = { features = ["python-default", "elm", "python-build"], solve-group = "python" }

[tasks]
openai-solar-demo = { cmd = "export OPENAI_API_KEY={{ api_key }}; compass process -c config.json5", args = ["api_key"], cwd = "examples/openai_solar_demo"}

[feature.rust-dev.tasks]
tests-r = "cargo test --locked --workspace --no-fail-fast"
publish-db = "cargo publish --locked -p infra-compass-db --all-features"
publish-cli = "cargo publish --locked -p infra-compass-cli --all-features"

[feature.python-dev.tasks]
lint = "ruff check ./compass"
format = "ruff format ./compass"

[feature.python-test.tasks]
tests-p = "pytest --durations=20 -rapP -vv --cov=compass --cov-report=html --cov-branch --cov-report=xml:coverage.xml --cov-fail-under=30 tests/python"
tests-u = "pytest --durations=20 -rapP -vv --cov=compass --cov-report=html --cov-branch --cov-report=xml:coverage.xml --cov-fail-under=30 tests/python/unit"
tests-i = "pytest --durations=20 -rapP -vv --cov=compass --cov-report=html --cov-branch --cov-report=xml:coverage.xml --cov-fail-under=10 tests/python/integration"

[feature.python-doc.tasks]
python-docs = { cmd = "make clean html", cwd = "docs", env = { SPHINXOPTS = "--fail-on-warning --keep-going --nitpicky" }}

[feature.python-build.tasks]
build-wheels = { cmd = "uv build --sdist --wheel --out-dir dist/ ." }

