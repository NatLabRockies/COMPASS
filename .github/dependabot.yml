version: 2
updates:

- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: weekly
  allow:
    - dependency-type: "direct"
  open-pull-requests-limit: 0

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
    day: monday
  groups:
    codeql:
      patterns:
        - "github/codeql-action*"
    other-actions:
      patterns:
        - "*"
      exclude-patterns:
        - "github/codeql-action*"
  open-pull-requests-limit: 10
  labels:
    - "chore"
    - "dependencies"
    - "github_actions"
