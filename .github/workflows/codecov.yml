name: Codecov

concurrency:
  group: codecov-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - compass/**
      - tests/**
      - .github/workflows/codecov.yml
      - pyproject.toml
      - pixi.lock
  pull_request:
    paths:
      - compass/**
      - tests/**
      - .github/workflows/codecov.yml
      - pyproject.toml
      - pixi.lock
  workflow_dispatch:

jobs:
  run:
    name: Codecov
    environment:
      name: codecov
      url: https://app.codecov.io/gh/NatLabRockies/COMPASS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true

    - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        pixi-version: v0.81.0
        locked: true
        cache: true
        cache-write: false
        environments: pdev

    - name: Generate coverage report
      run: |
        pixi reinstall -e pdev --locked INFRA-COMPASS
        pixi run -e pdev --locked tests-p

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        env_vars: OS,PYTHON
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
