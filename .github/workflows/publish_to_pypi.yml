name: Check PyPi build and optionally publish to PyPi

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - compass/**
      - README.rst
      - pyproject.toml
      - pixi.toml
      - pixi.lock
      - MANIFEST.in
      - .github/workflows/publish_to_pypi.yml
  push:
    branches: [main]
    paths:
      - compass/**
      - README.rst
      - pyproject.toml
      - pixi.toml
      - pixi.lock
      - MANIFEST.in
      - .github/workflows/publish_to_pypi.yml
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and upload wheels
    permissions:
      # IMPORTANT: write permission is mandatory for Trusted Publishing
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        fetch-tags: true

    - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
      with:
        pixi-version: v0.68.1
        locked: true
        cache: false
        environments: pbuild

    - name: Build
      run: pixi run -e pbuild build-wheels

    - name: Validate package metadata
      run: |
        python -m venv "$RUNNER_TEMP/twine-venv"
        "$RUNNER_TEMP/twine-venv/bin/pip" install --upgrade twine
        "$RUNNER_TEMP/twine-venv/bin/twine" check --strict dist/*

    - name: Publish package distributions to PyPI
      if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

