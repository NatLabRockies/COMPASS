name: Python checks
permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'compass/**/*.py'
      - 'tests/**/*.py'
      - .github/workflows/ci-python.yml
      - pyproject.toml
      - pixi.toml
      - pixi.lock
      - tox.ini
  pull_request:
    paths:
      - 'compass/**/*.py'
      - 'tests/**/*.py'
      - .github/workflows/ci-python.yml
      - pyproject.toml
      - pixi.toml
      - pixi.lock
      - tox.ini
  workflow_dispatch:

jobs:
  lint:
    name: Lint Python Code Base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Python Code (Ruff)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "latest"
          args: "check"
          src: "./compass"
      - name: Check Python Code Format (Ruff)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "latest"
          args: "format --check"
          src: "./compass"
      - name: Check Python Code Complexity (Complexipy)
        uses: rohaquinlop/complexipy-action@e2b05bcc06d899a24e2b6bb8b1354ac42800a95e # v7.0.1
        with:
          paths: "./compass"
          max_complexity_allowed: 10
          failed: false  # true
          sort: desc
          ignore_complexity: false  # Set to true to ignore complexity checks

  locked-tests:
    needs: lint
    name: Pixi-Locked Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8

    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true

    - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
      with:
        pixi-version: v0.81.0
        locked: true
        cache: true
        cache-write: false
        environments: pdev

    - run: |
        pixi reinstall -e pdev --locked INFRA-COMPASS
        pixi run -e pdev --locked tests-u

  unit-tests:
    needs: lint
    name: Python Unit Tests (Pixi)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: [ubuntu-latest, macos-latest, macos-26-intel, windows-latest]

    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install ONNX Runtime for Intel macOS
      if: runner.os == 'macOS' && runner.arch == 'X64'
      shell: bash
      run: |
        brew install onnxruntime
        ort_lib="$(brew --prefix onnxruntime)/lib"
        test -f "$ort_lib/libonnxruntime.dylib"
        echo "ORT_LIB_LOCATION=$ort_lib" >> "$GITHUB_ENV"
        echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
        echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=-Wl,-rpath,$ort_lib" >> "$GITHUB_ENV"

    - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
      with:
        pixi-version: v0.81.0
        locked: true
        cache: true
        cache-write: ${{ github.ref == 'refs/heads/main' }}
        environments: pdev

    - name: Install project and Docling
      run: |
        pixi reinstall -e pdev INFRA-COMPASS
        pixi run -e pdev --locked uv pip install --system --python python "docling-rs>=1.104.3,<2" "docling-core>=2.101.1,<3"
        pixi run -e pdev --locked python -c "import docling_core; from docling_rs import download_models; download_models()"

    - name: Run unit tests
      run: pixi run -e pdev tests-u

  macos-without-docling:
    needs: lint
    name: Python Tests without Docling (macOS)
    runs-on: macos-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true

    - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
      with:
        pixi-version: v0.81.0
        locked: true
        cache: false
        environments: pdev

    - name: Verify Docling is not installed
      run: |
        pixi reinstall -e pdev --locked INFRA-COMPASS
        pixi run -e pdev --locked python -c "from importlib.util import find_spec; assert find_spec('docling_rs') is None; assert find_spec('docling_core') is None"

    - name: Run tests without Docling
      run: pixi run -e pdev --locked tests-p

  integration-tests:
    needs: lint
    name: Python Integration Tests (Pixi)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: [ubuntu-latest, macos-latest, macos-26-intel, windows-latest]

    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install ONNX Runtime for Intel macOS
      if: runner.os == 'macOS' && runner.arch == 'X64'
      shell: bash
      run: |
        brew install onnxruntime
        ort_lib="$(brew --prefix onnxruntime)/lib"
        test -f "$ort_lib/libonnxruntime.dylib"
        echo "ORT_LIB_LOCATION=$ort_lib" >> "$GITHUB_ENV"
        echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
        echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=-Wl,-rpath,$ort_lib" >> "$GITHUB_ENV"

    - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
      with:
        pixi-version: v0.81.0
        locked: true
        cache: true
        cache-write: false
        environments: pdev

    - name: Prepare Docling models
      run: |
        pixi reinstall -e pdev --locked INFRA-COMPASS
        pixi run -e pdev --locked uv pip install --system --python python "docling-rs>=1.104.3,<2" "docling-core>=2.101.1,<3"
        pixi run -e pdev --locked python -c "import docling_core; from docling_rs import download_models; download_models()"

    - name: Run integration tests
      run: pixi run -e pdev tests-i

  docling-tests:
    needs: lint
    name: Docling Backend Integration Tests (Pixi)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true

    - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
      with:
        pixi-version: v0.81.0
        locked: true
        cache: true
        cache-write: false
        environments: pdev

    - name: Prepare Docling models
      run: |
        pixi reinstall -e pdev --locked INFRA-COMPASS
        pixi run -e pdev --locked uv pip install --system --python python "docling-rs>=1.104.3,<2" "docling-core>=2.101.1,<3"
        pixi run -e pdev --locked python -c "import docling_core; from docling_rs import download_models; download_models()"

    - name: Test production Docling backend
      run: pixi run -e pdev --locked tests-docling

  tox-tests:
    needs: lint
    name: Python tests (Tox)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: [ubuntu-latest, macos-latest, macos-26-intel]
        python-version: ['3.13', '3.12']
        exclude:
          # https://docling-project.github.io/docling/getting_started/installation/#:~:text=When%20installing%20Docling,using%20Python%203.13%2B.
          - os: macos-26-intel
            python-version: '3.13'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python  ${{ matrix.python-version }} (with cache)
      if: github.ref == 'refs/heads/main'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up Python  ${{ matrix.python-version }} (no cache)
      if: github.ref != 'refs/heads/main'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poppler Reqs (Linux)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libpoppler-cpp-dev poppler-utils

    - name: Install Poppler Reqs (Mac)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        brew install poppler

    - name: Install ONNX Runtime for Intel macOS
      if: runner.os == 'macOS' && runner.arch == 'X64'
      shell: bash
      run: |
        brew install onnxruntime
        ort_lib="$(brew --prefix onnxruntime)/lib"
        test -f "$ort_lib/libonnxruntime.dylib"
        echo "ORT_LIB_LOCATION=$ort_lib" >> "$GITHUB_ENV"
        echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
        echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=-Wl,-rpath,$ort_lib" >> "$GITHUB_ENV"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions>=2.0
        python -m pip install pdftotext

    - name: Load tox cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tox/
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-tox-v3-${{ hashFiles('**/pyproject.toml', 'tox.ini') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-tox-v3-

    - name: Test with tox
      run: tox -e ${{ matrix.python-version == '3.12' && 'msv' || 'latest' }}
      env:
        PYTHONDEVMODE: 1

    - name: Save tox cache only on main
      if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tox/
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-tox-v3-${{ hashFiles('**/pyproject.toml', 'tox.ini') }}
