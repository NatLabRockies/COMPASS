name: Container build, test, and publish

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Install the cosign tool if planning to release
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login against a Docker registry if planning to release
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build locally so untested images never receive release tags.
      # https://github.com/docker/build-push-action
      - name: Build Docker image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: compass-checks:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Offline Docker test as non-root
        timeout-minutes: 15
        run: |
          docker run --rm --network none --user 10001:10001 \
            --shm-size 1g --tmpfs /tmp:rw,exec,mode=1777 \
            -e HOME=/tmp/compass-checks-home \
            -v "$PWD/support/containers/container_checks.py:/tmp/container_checks.py:ro" \
            compass-checks:local python /tmp/container_checks.py

      - uses: eWaterCycle/setup-apptainer@4bb22c52d4f63406c49e94c804632975787312b3  # v2.0.0
        with:
          apptainer-version: "1.3.6"

      - name: Convert tested image to SIF
        run: |
          docker save compass-checks:local -o compass-image.tar
          apptainer build compass-linux-amd64.sif docker-archive://compass-image.tar
          rm compass-image.tar

      - name: Offline SIF test as non-root
        timeout-minutes: 15
        run: |
          sudo unshare --net -- /bin/bash -euc '
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --clear-groups \
              apptainer exec --containall --cleanenv \
              --env HOME=/tmp/compass-checks-home \
              --bind "$3/support/containers/container_checks.py:/tmp/container_checks.py:ro" \
              "$3/compass-linux-amd64.sif" \
              /app/entrypoint.sh python /tmp/container_checks.py
          ' -- "$(id -u)" "$(id -g)" "$PWD"
          sha256sum compass-linux-amd64.sif > compass-linux-amd64.sif.sha256

      - name: Publish tested Docker image
        id: build-and-push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker tag compass-checks:local "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          digest=$(docker image inspect compass-checks:local \
            --format '{{index .RepoDigests 0}}')
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"

      # Sign the resulting Docker image digest if planning to release.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v4.0.0
        with:
          name: compass-linux-amd64
          path: |
            compass-linux-amd64.sif
            compass-linux-amd64.sif.sha256
          compression-level: 0
          retention-days: 10
