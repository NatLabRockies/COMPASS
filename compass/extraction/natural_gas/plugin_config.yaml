schema: ./natural_gas_schema.json

data_type_short_desc: natural gas electric generating facility ordinance

query_templates:
  - "filetype:pdf {jurisdiction} electric generating facility zoning ordinance"
  - "{jurisdiction} gas-fired electric generating facility ordinance"
  - "{jurisdiction} power plant zoning ordinance setbacks"
  - "{jurisdiction} heavy industrial district setback requirements zoning"
  - "Where can I find the legal text for zoning ordinances governing electric generating facilities or power plants in {jurisdiction}?"
  - "What are the zoning district regulations and setback requirements for public utility or power generation facilities in {jurisdiction}?"

