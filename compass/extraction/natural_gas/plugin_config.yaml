schema: ./natural_gas_schema.json

data_type_short_desc: natural gas electric generating facility ordinance

query_templates:
  - "filetype:pdf {jurisdiction} zoning resolution district regulations"
  - "filetype:pdf {jurisdiction} zoning ordinance land use table zoning districts"
  - "filetype:pdf {jurisdiction} zoning ordinance industrial district setbacks height lot"
  - "{jurisdiction} zoning ordinance code of ordinances"
  - "site:municode.com {jurisdiction} zoning"
  - "site:ecode360.com {jurisdiction} zoning"
  - "site:codelibrary.amlegal.com {jurisdiction} zoning"
  - "{jurisdiction} gas-fired electric generating facility ordinance"

website_keywords:
  - "pdf"
  - ["gas", "natural gas", "generating facility", "power plant"]
  - ["zoning", "ordinance", "regulation"]
  - ["codelibrary", "amlegal", "municode", "codepublishing", "ecode360"]
  - ["power", "electric", "industrial district"]
  - ["plan", "planning", "permit"]
  - "government"
  - ["setback", "noise"]
  - ["code", "area"]
  - ["land development", "land use"]
  - ["land", "environment"]
  - ["municipal", "department", "development", "board"]

