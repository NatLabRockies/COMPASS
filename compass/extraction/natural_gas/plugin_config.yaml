collection_prompts:
  - key: contains_relevant_text
    label: generating use or supporting zoning context
    prompt: |-
      Decide whether this ordinance chunk should be retained as evidence
      for natural-gas electric generating facilities producing electricity
      for offsite sale or grid delivery.

      Return JSON (not markdown) with exactly two keys:
      1) "{key}" (boolean)
      2) "explanation" (string)

      Set "{key}" to true if ANY of the following is present:
      - Operative generating-facility or general public/nongovernmental
        utility definitions, permissions, prohibitions or requirements.
      - Use-table column headings, approval-symbol legends, blank-cell
        meanings, footnotes or rules for interpreting zoning tables.
        These are evidence even without a generating or utility use in
        this chunk. A legend is not merely a table of contents.
      - Substantive district dimensional or performance standards for
        principal uses, including lot area, width, frontage, coverage,
        height, yards, setbacks and noise.
      - Rules establishing how base districts, overlays, use categories,
        exemptions or special approvals interact.

      Collection is not the final applicability decision. Permission,
      table legends and dimensions may appear on different pages. Keep
      potentially applicable evidence without assuming that a plant is
      permitted in every district. The final parser makes that decision
      using the combined text.

      Set "{key}" to false for navigation or contents/index entries alone,
      or text solely about unrelated uses, including gas wells, pipelines,
      fuel storage, household gas equipment and onsite backup generators.
      Do not reject a mixed chunk that also meets any retention rule above.
text_extraction_prompts: true
cache_llm_generated_content: true