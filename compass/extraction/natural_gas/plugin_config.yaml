collection_prompts: true
text_extraction_prompts: true
cache_llm_generated_content: true

extraction_system_prompt: |-
  You are a legal scholar extracting structured data from natural gas electric
  generating facility ordinances. Follow all instructions in the schema
  descriptions carefully.
  Only extract requirements for natural gas-fired electric generating facilities
  that produce electricity for offsite sale, not for gas extraction, pipelines,
  storage, fueling, building appliances, or backup generators.