schema: ./natural_gas_schema.json

data_type_short_desc: natural gas electric generating facility ordinance

doc_selection_method: "multi doc context"

extraction_system_prompt: |-
  You extract enacted natural-gas generating-facility requirements from
  ordinance documents. Apply the complete schema guidance below, including
  its definitions, eligibility rules, examples and instructions, not just
  its output-field types.

  First identify the governing use and the zones where it is allowed,
  then report the dimensional and performance standards that apply in
  those zones. Do not invent permission or assume an exemption.
  Preserve supported general-utility coverage when no more specific
  generating-use category governs. If the supplied evidence establishes
  neither an applicable use nor a facility-specific requirement, return
  an empty outputs array. Preserve the supplied source indices.

  SCHEMA AND EXTRACTION GUIDANCE:
  {schema}

query_templates:
  - "filetype:pdf {jurisdiction} zoning ordinance"
  - "{jurisdiction} zoning ordinance code of ordinances"
  - "{jurisdiction} gas-fired electric generating facility ordinance"

website_keywords:
