  - "renewable energy"
  - ["plan", "planning", "permit"]
  - "government"
  - ["setback", "glare", "screening"]
  - ["code", "district"]
  - ["land development", "land use"]
  - ["land", "environment", "energy", "renewable"]
  - ["municipal", "department", "development", "board"]

