schema: ./solar_schema.json5

data_type_short_desc: utility-scale ground-mounted photovoltaic solar ordinance

cache_llm_generated_content: true

query_templates:
  - "filetype:pdf {jurisdiction} solar energy conversion system ordinances"
  - "filetype:pdf site:{jurisdiction_website} solar zoning ordinance regulations"
  - "{jurisdiction} zoning regulation utility-scale solar"
  - "commercial solar energy facility siting requirements {jurisdiction}"
  - "{jurisdiction} solar SECS ordinance"

