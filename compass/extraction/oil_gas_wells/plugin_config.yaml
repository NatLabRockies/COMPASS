collection_prompts:
  - key: contains_relevant_text
    label: oil and gas well applicability or governing standards
    prompt: |-
      You are validating whether an ordinance text chunk should be retained
      for oil and gas well extraction.

      Return JSON (not markdown) with exactly two keys:
      1) "{key}" (boolean)
      2) "explanation" (string)

      Set "{key}" = true when the chunk contains substantive regulatory text
      that is likely usable for oil and gas well extraction, including
      any of the following:
      - explicit oil well, gas well, petroleum, or hydrocarbon language; OR
      - oil and gas exploration, drilling, production, injection, disposal,
        hydraulic fracturing, plugging, abandonment, or reclamation terms; OR
      - operative zoning or development standards, use-table notes, permit
        requirements, siting constraints, hazard/site-condition requirements,
        decommissioning, bonding, lighting, fencing, color, or visual-impact
        requirements that can govern listed oil and gas wells, extraction uses,
        or directly associated well-site equipment within the same ordinance
        structure.

      Treat enforceable table notes and standards as relevant even when the
      same chunk does not repeat "oil and gas", as long as the text is
      substantive ordinance language tied to an oil-and-gas use in the same
      governing structure (not only headings/indexes).

      Set "{key}" = false only when the chunk is clearly irrelevant
      (e.g., table of contents, navigation text, or content focused on
      unrelated activities such as water wells, geothermal development,
      pipelines, refineries, bulk storage, or retail fuel sales only).
