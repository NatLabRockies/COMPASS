schema: ./data_centers_schema.json

data_type_short_desc: data center ordinance

cache_llm_generated_content: true

query_templates:
  - "{jurisdiction} data center ordinance"
  # Recently adopted ordinances are often published only as a PDF on the
  # jurisdiction's own site, before they are codified in a code library.
  - "filetype:pdf {jurisdiction} data center ordinance"
  - "site:{jurisdiction_website} data center"
  - "{jurisdiction} zoning ordinance"

